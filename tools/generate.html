<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <a class="navbar-brand" href="#">Workout Generator</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Generate Routine</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">My routines</a>
                        </li>
                    </ul>

                    <div class="d-flex">
                        <a href="#" class="btn btn-primary">Login</a>
                    </div>
                </div>
            </div>
        </nav>
        
<!---->>

        <div class="container d-flex justify-content-center mt-5 pt-5">
            <div class="card p-4" style="width: 100%; max-width: 700px;">
                <h2 class="text-center">Generate Routine</h2>
                <form action="/generateroutine" method="POST">
                    <div class="mb-3">
                        <label for="equipment" class="form-label">What equipment do you want to use?</label>
                        <select class="form-select" name="equipmentUsed" id="equipment">
                            <option value="none">None</option>
                            <option value="dumbbells" selected>Dumbbells</option>
                            <option value="machine">Machine</option>
                        </select>
                        <span id="error" class="text-danger">${errors.equipment?.message || ""}</span>
                    </div>
                    <div class="mb-3">
                        <label for="time" class="form-label">How many minutes per session?</label>
                        <select class="form-select" name="timeLimit" id="time">
                            <option value="30">30</option>
                            <option value="45">45</option>
                            <option value="60" selected>60</option>
                            <option value="75">75</option>
                            <option value="90">90</option>
                            <option value="105">105</option>
                            <option value="120">120</option>
                        </select>
                        <span id="error" class="text-danger">${errors.time?.message || ""}</span>
                    </div>
                    <div class="mb-3">
                        <label for="days" class="form-label">How many days a week do you want to workout?</label>
                        <select class="form-select" name="daysWeek" id="days">
                            <option value="2">2</option>
                            <option value="3" selected>3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                        </select>
                        <span id="error" class="text-danger">${errors.days?.message || ""}</span>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Generate</button>
                    </div>
                </form>
            </div>
        </div>

        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
